<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Western Fabrication">
  <!--
    Two peaks, one dominant. Four points and nothing else, because at the ~20px
    Trello renders a board button icon at, every extra vertex turns the ridge
    into a wave. White and stroked so it reads on the navy ops header and on a
    dark board background, matching the outline weight of the company mark.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 120 L56 22 L86 72 L108 48 L136 120"/>
  </g>
</svg>
