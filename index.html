<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Western Fabrication Ops Power-Up</title>
</head>
<body>
  <!--
    This file is the Power-Up's iframe connector URL, so it is the outermost
    thing Trello caches and the last place a stale copy can hide. The ?v= below
    must be bumped with the one in popups/ops.html whenever anything under lib/
    or popups/ changes.

    The chain: Trello loads index.html -> connector.js?v -> ops.html?t=<now>
    -> every asset ?v. Each link exists because the one outside it caches.
  -->
  <!--
    THIS LIST MUST NOT BE A SHORTER VERSION OF popups/ops.html's.

    It was, and two things silently broke on every card surface:

    lib/board-extras.js adds the three Assemble lists (Legacy, CAP, CNC) to the
    board map at runtime, because they were created after config.js was written.
    Without it the connector's WFStage has never heard of the lists where all the
    welding happens: getStageForList and getNextStage answer null, so a card
    completed from a card button or the card back does not move and the log
    entry records a raw list id instead of a phase name. The test harness loads
    this file, so every test saw a board the connector did not have.

    lib/jobtype.js + lib/advance.js install the route-aware WFPhase.advance
    wrapper. lib/phase.js deliberately calls through the global so the wrapper
    applies -- with neither file loaded there is no wrapper, and every card
    advanced from a card surface routes as legacy. That is the same regression
    we fixed for the ops window; it was still live here.

    Order matters: config.js, then board-extras, then stage.js; jobtype before
    advance; advance after phase.js, because it wraps what phase.js defines.
  -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js?v=20260917b"></script>
  <!--
    store.js, or lib/phase.js falls back to trimming the phase log to 30
    entries here. Thirty entries is roughly 11,000 characters against a card
    budget of 4,096, so a well-travelled job would overflow and the hand-off
    would fail with it. The guard in advance() is written to degrade rather
    than crash when WFStore is absent — which means a missing script tag is
    silent, and this comment is the only thing standing between that and a
    repeat of the bug this file was added to fix.
  -->
  <script src="./lib/store.js?v=20260917b"></script>
  <script src="./lib/board-extras.js?v=20260917b"></script>
  <script src="./lib/stage.js?v=20260917b"></script>
  <script src="./lib/trello-rest.js?v=20260917b"></script>
  <script src="./lib/phase.js?v=20260917b"></script>
  <script src="./lib/jobtype.js?v=20260917b"></script>
  <script src="./lib/advance.js?v=20260917b"></script>
  <script src="./connector.js?v=20260917b"></script>
</body>
</html>
