<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Western Fabrication Ops</title>

  <!--
    EVERY LOCAL ASSET CARRIES ?v=  AND THE NUMBER MUST BE BUMPED ON EVERY DEPLOY.

    A Power-Up runs inside a Trello iframe, and GitHub Pages serves static files
    with long cache lifetimes. The iframe therefore keeps serving whatever it
    fetched the first time -- through a hard refresh of the outer page, because
    the outer page is not what is cached. We shipped a restyled stylesheet and a
    rebuilt Roster tab, confirmed both live on GitHub Pages, and neither
    appeared. That is not a mystery to debug each time; it is a missing version
    token.

    Bump WF_BUILD below whenever anything under lib/, popups/ or styles.css
    changes. Any new value works -- it only has to differ from the last one.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../styles.css?v=20260916e">
  <style>
    body { padding: 0; background: var(--wf-ground); }
  </style>
</head>
<body>
  <div class="wf-shell">
    <header class="wf-top">
      <div class="wf-brand">
        <img src="../icon.svg" alt="">
        <div class="wf-wordmark">WESTERN FABRICATION</div>
      </div>
      <div class="wf-boardpill" id="boardName">Loading board…</div>
      <div class="wf-topmeta">
        <span id="syncNote"></span>
        <div class="wf-who"><div class="wf-avatar" id="meInitials">··</div><span id="meName"></span></div>
      </div>
    </header>

    <nav class="wf-tabbar" id="tabbar"></nav>
    <main class="wf-body" id="view"><div class="loading">Starting up…</div></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    /* The one place the build number lives. Everything below is written out
       with it appended, so there is no list of URLs to keep in step. */
    window.WF_BUILD = "20260916e";
    document.write(
      [
        "../config.js",
        /* Must load before trello-rest.js so it can wrap the write methods. */
        "../lib/sandbox.js",
        "../lib/board-extras.js",
        "../lib/stage.js",
        "../lib/trello-rest.js",
        "../lib/phase.js",
        "../lib/metrics.js",
        "../lib/roster.js",
        "../lib/pricing.js",
        "../lib/costing.js",
        "../lib/qc.js",
        "../lib/jobtype.js",
        "../lib/advance.js",
        "../lib/sop.js",
        "../lib/eos.js",
        "../lib/tables.js",
        "../lib/aging.js",
        "../lib/records.js",
        "../lib/cardview.js",
        "../lib/permissions.js",

        "./ops.js",
        /* Shared by every tab that lists jobs; must load after ops.js. */
        "./cardpanel.js",
        /* Shared by My jobs and the Work board; must load before the tabs. */
        "./checklist.js",

        "./tabs/floor.js",
        "./tabs/dashboard.js",
        "./tabs/workboard.js",
        "./tabs/myjobs.js",

        /* RETIRED, NOT DELETED: ./tabs/qc.js and ./tabs/approvals.js
         *
         * Quality check became redundant once signed checks are read in
         * Records, and Approvals is the queue the checklist model replaced --
         * a place work waited rather than a place anything was decided.
         *
         * The files stay in the repo and lib/qc.js still carries the older
         * peer-review functions they used, so bringing either back is
         * uncommenting one line. Deleting them would throw away a working
         * review round-trip we may want again for a phase where a second pair
         * of eyes is genuinely worth the wait.
         *
         * Nothing else references them: they registered themselves via O.tab
         * on load, so not loading them is the whole retirement.
         */
        "./tabs/performance.js",
        /* Nested inside Performance's ribbon -- see their `parent` field. */
        "./tabs/costing.js",
        "./tabs/records.js",

        "./tabs/sops.js",
        "./tabs/eos.js",
        "./tabs/roster.js"
      ].map(function (src) {
        /* document.write rather than appending elements: these files are plain
           scripts that must run in order, and dynamically appended scripts do
           not guarantee that. This runs once, before the page is parsed, which
           is the case document.write is actually correct for. */
        return '<script src="' + src + "?v=" + window.WF_BUILD + '"><\/script>';
      }).join("")
    );
  </script>

  <script>WFOps.start();</script>
</body>
</html>
