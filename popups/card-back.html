<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!--
    VERSIONED, LIKE ops.html. This is a live per-card work surface running
    inside a Trello iframe, which caches exactly as hard as the ops window does.
    It was the only work surface outside the cache-bust scheme, so it could be
    running a months-old lib/phase.js and config.js against a current board with
    nothing to show for it. Bump these with WF_BUILD in popups/ops.html.
  -->
  <link rel="stylesheet" href="../styles.css?v=20260917b">
  <style>
    body { padding: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .actions button { margin-top: 0; }
    button.secondary {
      background: #fff; color: #172b4d; border: 1px solid #dfe1e6;
      border-radius: 3px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    }
    button.secondary:hover { background: #f4f5f7; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .slider-row input[type=range] { flex: 1; }
    .slider-row .pct { width: 40px; text-align: right; font-weight: 600; }
  </style>
</head>
<body>
  <div id="content" class="loading">Loading job actions…</div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <!-- board-extras, jobtype and advance for the same reasons index.html now
       loads them: without the first this surface has never heard of the three
       Assemble lists, and without the last two every card it advances routes
       as legacy. -->
  <script src="../config.js?v=20260917b"></script>
  <!-- store.js for the same reason index.html loads it: without it phase.js
       falls back to a 30-entry phase log, which is ~11,000 characters against
       a 4,096-character card budget. -->
  <script src="../lib/store.js?v=20260917b"></script>
  <script src="../lib/board-extras.js?v=20260917b"></script>
  <script src="../lib/stage.js?v=20260917b"></script>
  <script src="../lib/trello-rest.js?v=20260917b"></script>
  <script src="../lib/phase.js?v=20260917b"></script>
  <script src="../lib/jobtype.js?v=20260917b"></script>
  <script src="../lib/advance.js?v=20260917b"></script>
  <script src="./card-back.js?v=20260917b"></script>
</body>
</html>
